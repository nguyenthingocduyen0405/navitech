# 로컬 미리보기: 서버에 올리기 전에 이 PC에서 확인합니다.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build postgres keycloak agents-k agents-group claude-bridge gateway open-webui preview
#   → http://localhost:8088 (Open WebUI), http://localhost:8088/meetings/ (회의 업무)
# - .env는 localhost용 (OPENWEBUI_PUBLIC_URL=http://localhost:8088, KEYCLOAK_PUBLIC_URL=http://localhost:8080)
# - Agent backend는 옆 폴더 ../capstone_demo/backend를 빌드합니다 (서버에서는 ./agent-backend/backend)
# - preview(nginx)가 서버의 nginx처럼 / → Open WebUI, /meetings/ → gateway를 같은 주소로 묶습니다
# - speech-service · retention · admin-portal은 띄우지 않아도 됩니다 (녹음 STT만 안 됨)
# - mailpit: Agent가 보낸 메일을 밖으로 내보내지 않고 받아 둡니다 → http://localhost:8025 (메일함)
x-local-backend: &local-backend
  build:
    context: ../capstone_demo/backend
    dockerfile: ../../navitech/infra/agent-backend/Dockerfile
  environment:
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_SECURITY: none
    SMTP_USERNAME: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: Navitech 회의지원 Agent <meeting-agent@navitech.local>
    MEETINGS_DELIVERY_INTERVAL: "15"

services:
  agents-k:
    <<: *local-backend
  agents-group:
    <<: *local-backend

  preview:
    image: nginx:1.29-alpine
    volumes:
      - ./infra/preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - open-webui
      - gateway
      - speech-service

  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:8025:8025"
