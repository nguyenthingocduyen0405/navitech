name: capstone

# 모든 포트는 서버의 127.0.0.1에만 바인딩됩니다. HTTPS와 공개 포트를 설정하기 전까지는
# SSH 터널로 접속하세요 (README 참고).

# Agent backend (agent-backend/ = flopsoda/capstone_demo): 한 이미지로 두 Agent System을 띄웁니다.
# 외부 포트는 열지 않습니다 — gateway만 Group system을 호출하고, Group은 K전자에 A2A(HTTP)로 요청합니다.
x-agent-backend: &agent-backend
  build:
    context: ./agent-backend/backend
    dockerfile: ../../infra/agent-backend/Dockerfile
  restart: unless-stopped
  mem_limit: 768m

# agent-backend/backend/app/runtime/llm.py: LLM_PROVIDER=ollama(기본, Ollama Cloud) | openai(OpenAI 호환 API, 예: Groq gpt-oss, claude-bridge)
x-llm-env: &llm-env
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}

# 두 Agent System의 회의 기능 공통 설정 (agent-backend/backend/app/library/workflows/)
x-meetings-env: &meetings-env
  # gateway가 서명한 요청자만 믿음 (runtime/principal.py). Group → K A2A도 같은 서명을 그대로 전달
  PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY}
  # 회의록 확정 · 정정, Compliance 검토, 메일 발송 승인, 업무 요청 접수: 회의의 의장 · 간사 + 이 그룹
  MEETINGS_CONFIRM_GROUPS: ${MEETINGS_CONFIRM_GROUPS:-secretary,executive}
  # 녹음 transcript: speech-service가 준 id로 가져와 1년 보관 (transcripts.py)
  SPEECH_SERVICE_URL: http://speech-service:8000
  SPEECH_API_KEY: ${SPEECH_API_KEY}
  MEETINGS_TRANSCRIPT_RETENTION_DAYS: ${MEETINGS_TRANSCRIPT_RETENTION_DAYS:-365}
  # 메일 받는 사람의 등록 이메일 (Keycloak) — gateway의 내부 API
  DIRECTORY_URL: http://gateway:8000/internal/directory/people
  INTERNAL_API_KEY: ${INTERNAL_API_KEY}
  # 승인된 메일 발송 · 매일 09:00 기한 알림 · 만료 transcript 삭제 (jobs.py). SMTP_HOST가 비면 승인된 메일은 대기
  MEETINGS_BACKGROUND_JOBS: "1"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SPEECH_DB_PASSWORD: ${SPEECH_DB_PASSWORD}
      AGENTS_K_DB_PASSWORD: ${AGENTS_K_DB_PASSWORD}
      AGENTS_GROUP_DB_PASSWORD: ${AGENTS_GROUP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: start-dev --import-realm
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # 브라우저는 공개 URL을, 컨테이너(Open WebUI, gateway)는 http://keycloak:8080 을 사용합니다.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx512m"
      # infra/keycloak/import/capstone-realm.json 의 자리표시자(${...})에 들어갈 값
      OPENWEBUI_PUBLIC_URL: ${OPENWEBUI_PUBLIC_URL}
      ADMIN_PORTAL_PUBLIC_URL: ${ADMIN_PORTAL_PUBLIC_URL}
      OPENWEBUI_OIDC_CLIENT_SECRET: ${OPENWEBUI_OIDC_CLIENT_SECRET}
      GATEWAY_KC_CLIENT_SECRET: ${GATEWAY_KC_CLIENT_SECRET}
      VOICE_OIDC_CLIENT_SECRET: ${VOICE_OIDC_CLIENT_SECRET}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD}
    volumes:
      - ./infra/keycloak/import:/opt/keycloak/data/import:ro
      - ./infra/keycloak/themes/capstone:/opt/keycloak/themes/capstone:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  agents-k:
    # K전자 Agent System: K Super → 미팅 / 뉴스 / 경영자문. Group의 A2A 요청을 /api/a2a/run에서 받음
    <<: *agent-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: [*llm-env, *meetings-env]
      # 회의 저장소: DB agents의 schema kelec (role agents_k는 Group schema에 접근 불가). principal 없는 요청은 열람 불가(0)
      MEETINGS_DATABASE_URL: postgresql://agents_k:${AGENTS_K_DB_PASSWORD}@postgres:5432/agents
      MEETINGS_ANONYMOUS_CLEARANCE: "0"
    depends_on:
      postgres:
        condition: service_healthy

  agents-group:
    # Group Agent System: Group Super → 그룹 전문 Agent 위임 | K전자 A2A. Open WebUI의 4개 Agent가 여기로 연결됨
    <<: *agent-backend
    command: ["uvicorn", "app.systems.group.app:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: [*llm-env, *meetings-env]
      K_ELECTRONICS_A2A_URL: http://agents-k:8000/api/a2a/run
      MEETINGS_DATABASE_URL: postgresql://agents_group:${AGENTS_GROUP_DB_PASSWORD}@postgres:5432/agents
      MEETINGS_ANONYMOUS_CLEARANCE: "0"
    depends_on:
      postgres:
        condition: service_healthy
      agents-k:
        condition: service_started

  claude-bridge:
    # 테스트용 LLM: OpenAI 호환 API → Claude 구독 (infra/claude-bridge). 유료 API 키 불필요.
    # 사용: .env에 CLAUDE_CODE_OAUTH_TOKEN(`claude setup-token`) + LLM_PROVIDER=openai, OPENAI_BASE_URL=http://claude-bridge:8080/v1
    build: ./infra/claude-bridge
    restart: unless-stopped
    mem_limit: 1g
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-sonnet}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-}
      BRIDGE_API_KEY: ${CLAUDE_BRIDGE_API_KEY:-}
      BRIDGE_MAX_CONCURRENCY: ${CLAUDE_BRIDGE_MAX_CONCURRENCY:-2}

  speech-service:
    # 화자 식별 STT: Open WebUI가 STT 엔진(openai 호환)으로 호출 → VAD + 등록된 voiceprint로 발언자 표시.
    # 음성 등록 페이지 /voice/ (nginx → 127.0.0.1:8095, Keycloak 로그인). voiceprint는 Postgres DB `speech`
    build: ./infra/speech-service
    restart: unless-stopped
    mem_limit: 1536m
    environment:
      SPEECH_API_KEY: ${SPEECH_API_KEY}
      SPEECH_DATABASE_URL: postgresql://speech:${SPEECH_DB_PASSWORD}@postgres:5432/speech
      STT_ENGINE: ${STT_ENGINE:-auto}          # auto: GROQ_API_KEY가 있으면 groq, 없으면 local(SenseVoice)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_STT_MODEL: ${GROQ_STT_MODEL:-whisper-large-v3-turbo}
      VOICE_MATCH_THRESHOLD: ${VOICE_MATCH_THRESHOLD:-0.5}
      PUBLIC_BASE_URL: ${OPENWEBUI_PUBLIC_URL}/voice
      OIDC_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL}/realms/capstone
      OIDC_INTERNAL_ISSUER: http://keycloak:8080/realms/capstone
      OIDC_CLIENT_ID: voice-enroll
      OIDC_CLIENT_SECRET: ${VOICE_OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${VOICE_SESSION_SECRET}
      VOICEPRINT_KEY: ${VOICEPRINT_KEY}   # voiceprint 암호화 키 (개인정보의 안전성 확보조치 기준 제7조)
      # 회의 transcript를 id로 보관하는 기간 (회의지원 Agent가 가져가 자기 저장소에 따로 보관)
      TRANSCRIPT_RETENTION_DAYS: ${TRANSCRIPT_RETENTION_DAYS:-30}
    volumes:
      - ./infra/speech-service/models:/models:ro   # infra/speech-service/download_models.sh
    ports:
      - "127.0.0.1:8095:8000"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: .
    restart: unless-stopped
    environment:
      # 실제 Agent: Group Agent System (K전자는 Group Super의 A2A로만). 비우면 mock Agent (agents/registry.py)
      AGENT_BACKEND_URL: http://agents-group:8001
      PRINCIPAL_SIGNING_KEY: ${PRINCIPAL_SIGNING_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}   # /internal/directory/people (Agent backend의 메일 주소 조회)
      BACKEND_API_KEY: ${BACKEND_API_KEY}
      OWUI_FORWARD_JWT_SECRET: ${OWUI_FORWARD_JWT_SECRET}
      PERMISSIONS_FILE: /app/config/permissions.yaml
      APP_DATABASE_URL: postgresql://app:${APP_DB_PASSWORD}@postgres:5432/app
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: capstone
      GATEWAY_KC_CLIENT_ID: gateway
      GATEWAY_KC_CLIENT_SECRET: ${GATEWAY_KC_CLIENT_SECRET}
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      agents-group:
        condition: service_started
      agents-k:
        condition: service_started

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4
    command: ["bash", "-c", "sed -i \"s/WEBUI_NAME += ' (Open WebUI)'/WEBUI_NAME += ''/\" /app/backend/open_webui/env.py || true; cp -f /branding/* /app/backend/open_webui/static/ 2>/dev/null || true; cp -f /branding/* /app/build/static/ 2>/dev/null || true; cp -f /branding/favicon.png /app/build/favicon.png 2>/dev/null || true; grep -rlE '모델(에서)? 검색' /app/build/_app | xargs -r sed -i -e 's/모델 검색/에이전트 검색/g' -e 's/모델에서 검색/에이전트에서 검색/g' || true; exec bash start.sh"]
    restart: unless-stopped
    environment:
      WEBUI_URL: ${OPENWEBUI_PUBLIC_URL}
      WEBUI_NAME: Navitech
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      DATABASE_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD}@postgres:5432/openwebui
      # 환경 변수가 기준입니다. 관리자 화면에서 바꾼 설정은 재시작하면 사라집니다.
      ENABLE_PERSISTENT_CONFIG: "false"

      # --- Agent: gateway가 유일한 모델 제공자 ---
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${BACKEND_API_KEY}
      # Agent 전환은 왼쪽 메뉴에서: 각 Agent를 사이드바에 고정 (권한 없는 Agent는 Open WebUI가 목록에서 뺌)
      DEFAULT_PINNED_MODELS: super-agent,news-agent,advisory-agent,meeting-agent
      # 채팅을 화면 가운데 좁은 칸(58rem)이 아니라 전체 폭으로 — 사용자가 설정 > 인터페이스에서 끌 수 있음
      DEFAULT_INTERFACE_SETTINGS: '{"widescreenMode": true}'
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      # 관리자도 소속 그룹이 허용한 Agent만 보입니다 — gateway의 검사 규칙과 동일
      BYPASS_ADMIN_ACCESS_CONTROL: "false"
      # 위조 가능한 일반 헤더 대신 서명된 JWT(X-OpenWebUI-User-Jwt)로 사용자 정보 전달
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      FORWARD_USER_INFO_HEADER_JWT_SECRET: ${OWUI_FORWARD_JWT_SECRET}

      # --- SSO 로그인만 허용 (Keycloak) ---
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      OAUTH_AUTO_REDIRECT: "true"            # Open WebUI 자체 로그인 화면 없이 Keycloak으로 바로 이동
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: SSO
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/capstone/.well-known/openid-configuration
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: ${OPENWEBUI_OIDC_CLIENT_SECRET}
      OAUTH_SCOPES: openid email profile
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: realm_access.roles
      OAUTH_ALLOWED_ROLES: user,admin
      OAUTH_ADMIN_ROLES: admin
      ENABLE_OAUTH_GROUP_MANAGEMENT: "true"
      ENABLE_OAUTH_GROUP_CREATION: "false"   # 그룹은 sync_openwebui가 permissions.yaml 기준으로 생성
      OAUTH_GROUPS_CLAIM: groups
      ENABLE_API_KEYS: "true"                # gateway.sync_openwebui 실행용 관리자 키

      # --- 데이터 보호 ---
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"

      # --- 켜 두면 Open WebUI가 자체 프롬프트로 우리 Agent를 호출하므로 끔 (제목·태그 생성 등) ---
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"

      # --- RAG는 우리 백엔드에서 처리: Open WebUI의 로컬 임베딩 모델을 로드하지 않음 (메모리 절약) ---
      RAG_EMBEDDING_ENGINE: openai
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"

      # --- 음성 → 텍스트: speech-service(화자 식별). 녹음 파일 업로드와 채팅창 마이크가 모두 이 경로 ---
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://speech-service:8000/v1
      AUDIO_STT_OPENAI_API_KEY: ${SPEECH_API_KEY}
      AUDIO_STT_MODEL: navitech-speaker-stt
    volumes:
      - owui-data:/app/backend/data
      # 시작 시 /static/custom.css로 복사됨: 글꼴·글자 크기·색상 (infra/open-webui/custom.css 참고)
      - ./infra/open-webui/custom.css:/app/build/static/custom.css:ro
      # 왼쪽 메뉴에 '회의 업무'(/meetings/) 링크를 더함 (Open WebUI의 빈 훅 loader.js를 덮어씀)
      - ./infra/open-webui/loader.js:/app/build/static/loader.js:ro
      - ./infra/open-webui/branding:/branding:ro
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started

  retention:
    # Open WebUI가 STT 후에도 보관하는 회의 녹음(wav · mp3 · json)을 보존 기간이 지나면 삭제 (infra/retention)
    build: ./infra/retention
    restart: unless-stopped
    mem_limit: 128m
    environment:
      OPENWEBUI_DATABASE_URL: postgresql://openwebui:${OPENWEBUI_DB_PASSWORD}@postgres:5432/openwebui
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
      INTERVAL_HOURS: "6"
    volumes:
      - owui-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy

  admin-portal:
    # 사용자 · 권한 관리 페이지. 정적 파일만 제공하며, 로그인한 관리자 본인의 토큰으로 Keycloak Admin API를 호출합니다.
    image: nginx:1.29-alpine
    restart: unless-stopped
    environment:
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
    volumes:
      - ./admin-portal:/usr/share/nginx/html:ro
      - ./config/permissions.yaml:/srv/config/permissions.yaml:ro
      - ./infra/admin-portal/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:3001:80"

volumes:
  pgdata:
  owui-data:
