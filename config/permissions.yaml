# 권한의 단일 기준 파일.
# Gateway(권한 검사)와 gateway/sync_openwebui.py(Open WebUI 모델 표시)가 함께 읽습니다.
# 그룹 이름은 Keycloak 그룹 이름과 정확히 같아야 합니다.
#
# 서로 독립된 두 축:
#   - Keycloak 역할 (user / admin) = 시스템을 누가 관리하는가. `admin`만으로는 Agent·자료 권한이 없음.
#   - 업무 그룹 (아래)              = 어떤 Agent를 쓰고, 어느 등급의 자료까지 볼 수 있는가.
# 한 사람이 둘 다 가질 수 있습니다. 예: 운영자이면서 개발자 → admin 역할 + developer 그룹.

classification_levels:
  1: 공개
  2: 사내
  3: 대외비
  4: 극비

agents:
  super-agent:
    name: Super Agent
    description: 질문을 분석해 경영자문·뉴스·회의지원 Agent에 분배하고 결과를 종합합니다.
    suggestions:
      - {title: 브라이트셀 인수 검토, prompt: "브라이트셀 인수 건, 지난 회의 기준과 최근 뉴스를 반영해 CFO 관점으로 검토해 줘."}
      - {title: 뉴로엣지 그룹 투자심의, prompt: "뉴로엣지 인수안을 그룹 투자심의에서 승인할지 판단해 줘."}
      - {title: 계열사 리스크 요약, prompt: "최근 계열사 리스크 뉴스를 요약하고 그룹 차원에서 볼 점을 정리해 줘."}
  advisory-agent:
    name: 경영자문 Agent
    description: 공시·산업 리포트·사내 경영정보 기반 전략 자문 (CSO vs CFO 관점).
    suggestions:
      - {title: 브라이트셀 CFO 관점, prompt: "브라이트셀 인수안을 CFO 관점으로 검토해 줘."}
      - {title: 브라이트셀 CTO 관점, prompt: "브라이트셀 인수안을 CTO 관점으로 검토해 줘."}
  news-agent:
    name: 뉴스 Briefing Agent
    description: 경영 관련 뉴스 수집·요약 및 So-What 도출.
    suggestions:
      - {title: 브라이트셀 리스크, prompt: "브라이트셀 관련 리스크 뉴스 정리해 줘."}
      - {title: K바이오 핵심인력, prompt: "K바이오 핵심인력 이탈 뉴스와 영향을 알려 줘."}
      - {title: K물산 노사 동향, prompt: "K물산 노조 파업 예고 관련 리스크를 정리해 줘."}
  meeting-agent:
    name: 회의지원 Agent
    description: 회의록 요약, Action Item 추출·추적, 사전 참고자료 제공.
    suggestions:
      - {title: 기한 임박 업무, prompt: "기한이 지났거나 이번 주 마감인 Action Item 보여 줘."}
      - {title: 보낸 메일, prompt: "회의지원 Agent가 최근에 보낸 메일 보여 줘."}
      - {title: 지난 투심위 기준, prompt: "9월 그룹 투자심의위원회 사전회의에서 정한 기준을 알려 줘."}

groups:
  executive:
    description: 경영진 (C-Level)
    clearance: 4
    agents: [super-agent, advisory-agent, news-agent, meeting-agent]
  secretary:
    description: 회의체 간사
    clearance: 3          # 대외비 — 회의 참석자 정보가 생기면 본인 회의로 범위를 좁힐 예정
    agents: [super-agent, news-agent, meeting-agent]
  staff:
    description: 실무자 / 분석가
    clearance: 2
    agents: [super-agent, advisory-agent, news-agent, meeting-agent]
  developer:
    description: 개발팀 — 모든 Agent 테스트 가능, 공개 자료만 열람
    clearance: 1
    agents: [super-agent, advisory-agent, news-agent, meeting-agent]
