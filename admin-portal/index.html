<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>사용자 · 권한 관리 — Navitech</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="mark">C</span>
        <span class="brand-name">Navitech</span>
        <span class="crumb">사용자 · 권한 관리</span>
      </div>
      <div class="me">
        <span id="me-name"></span>
        <button id="logout" class="btn ghost" type="button">로그아웃</button>
      </div>
    </header>

    <main>
      <p id="state" class="state">불러오는 중…</p>

      <section id="users-section" hidden>
        <div id="stats" class="stats"></div>
        <div class="section-head">
          <div>
            <h1>사용자</h1>
            <p class="muted">권한 그룹이 사용할 수 있는 Agent와 자료 열람 등급을 정합니다.</p>
          </div>
          <div class="actions">
            <input id="search" type="search" placeholder="이름 · 아이디 · 이메일 검색" aria-label="사용자 검색" />
            <button id="add-user" class="btn primary" type="button">+ 사용자 추가</button>
          </div>
        </div>
        <div class="table-wrap">
          <table id="users">
            <thead>
              <tr>
                <th>이름</th>
                <th>이메일</th>
                <th>권한</th>
                <th>열람 등급</th>
                <th>상태</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

      <section id="policy-section" hidden>
        <h2>권한 체계</h2>
        <p class="muted">
          그룹별 권한은 <code>config/permissions.yaml</code>에서 정의합니다. 이 표를 바꾸려면 파일 수정 후 gateway 재시작과
          동기화가 필요합니다 (README 참고).
        </p>
        <div class="table-wrap">
          <table id="policy"></table>
        </div>
      </section>
    </main>

    <dialog id="dialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
